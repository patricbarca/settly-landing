    <style>
      .links-page {
        min-height: 100vh;
        background: linear-gradient(160deg, #241C53 0%, #141238 45%, #0D1B2A 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 56px 22px; text-align: center; color: #fff; position: relative; overflow: hidden;
      }
      .links-page .glow { position: absolute; border-radius: 50%; filter: blur(10px); pointer-events: none; }
      .links-page .g1 { width: 60vw; height: 60vw; max-width: 460px; max-height: 460px;
        background: radial-gradient(circle, rgba(15,163,163,.25), transparent 65%); top: -12%; right: -18%; }
      .links-page .g2 { width: 62vw; height: 62vw; max-width: 480px; max-height: 480px;
        background: radial-gradient(circle, rgba(91,91,240,.28), transparent 65%); bottom: -14%; left: -18%; }
      .links-inner { position: relative; z-index: 2; width: 100%; max-width: 380px; }
      .links-icon { width: 108px; height: 108px; border-radius: 26px; margin: 0 auto 22px;
        background: linear-gradient(145deg, #0f2d54, #0a1a2e, #0d2340);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.5);
        border: 1px solid rgba(255,255,255,.10); display: flex; align-items: center; justify-content: center; }
      .links-icon img { width: 62px; height: auto; display: block; }
      .links-brand { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
      .links-tag { color: #9fb2d8; font-size: 15px; margin-top: 10px; }
      .links-tag b { color: #7DB8FF; font-weight: 700; }
      .links-list { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; }
      .link-btn { display: flex; align-items: center; gap: 14px; width: 100%;
        padding: 17px 20px; border-radius: 18px; text-decoration: none; font-weight: 700; font-size: 17px;
        background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #fff;
        transition: transform .12s ease, background .12s ease; }
      .link-btn.primary { background: linear-gradient(135deg, #5B5BF0, #0FA3A3); border-color: transparent; }
      /* Hover SOLO en dispositivos con puntero (ratón). En táctil, un :hover
         "pegajoso" se come el primer toque y obliga a pulsar dos veces. */
      @media (hover: hover) {
        .link-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
        .link-btn.primary:hover { background: linear-gradient(135deg, #6a6af5, #14b8b8); }
      }
      .link-btn:active { transform: translateY(0); opacity: .9; }
      .link-btn .ic { width: 34px; height: 34px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
      .link-btn .ic svg { width: 26px; height: 26px; fill: currentColor; }
      .link-btn .tx { text-align: left; line-height: 1.15; }
      .link-btn .tx small { display: block; font-size: 12px; font-weight: 500; opacity: .8; }
      .links-foot { margin-top: 30px; font-size: 13px; color: #7a90bb; }
      .links-foot a { color: #9fb2d8; text-decoration: underline; }
    </style>
      <script defer src="/assets/ads.js"></script>
  </head>
  <body>

        <div class="links-tag" data-es-html="Divide gastos con amigos · <b>con IA</b>">Split expenses with friends · <b>powered by AI</b></div>

        <div class="links-list">
          <a class="link-btn primary" href="https://apps.apple.com/app/settlia/id6787267468">
            <span class="ic"><svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></span>
            <span class="tx"><small data-es="Descárgala en">Download on the</small>App Store</span>
          </a>

          <a class="link-btn" href="https://app.settlia.app">
            <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.6a15.7 15.7 0 0 0-1.3-3.4A8 8 0 0 1 18.9 8ZM12 4c.8 1.1 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.9 1.9-4ZM4.3 14a7.9 7.9 0 0 1 0-4h3a17.6 17.6 0 0 0 0 4h-3Zm.8 2h2.6c.3 1.2.8 2.4 1.3 3.4A8 8 0 0 1 5.1 16Zm2.6-8H5.1a8 8 0 0 1 3.9-3.4C8.5 5.6 8 6.8 7.7 8ZM12 20c-.8-1.1-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.9-1.9 4Zm2.3-6H9.7a15.6 15.6 0 0 1 0-4h4.6a15.6 15.6 0 0 1 0 4Zm.7 5.4c.5-1 1-2.2 1.3-3.4h2.6a8 8 0 0 1-3.9 3.4Zm1.7-5.4a17.6 17.6 0 0 0 0-4h3a7.9 7.9 0 0 1 0 4h-3Z"/></svg></span>
            <span class="tx" data-es="Abrir la web app">Open the web app</span>
          </a>

          <a class="link-btn" href="https://settlia.app">
            <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Zm0 7.2L5.5 6 12 3.8 18.5 6 12 9.2ZM2 17l10 5 10-5-2.2-1.1L12 19.4 4.2 15.9 2 17Zm0-5 10 5 10-5-2.2-1.1L12 14.4 4.2 10.9 2 12Z"/></svg></span>
            <span class="tx"><small data-es="Más info">Learn more</small>settlia.app</span>
          </a>
        </div>

        <div class="links-foot">
          <span>Settlia 2026</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var KEY = "settly-landing-lang";
        function getLang() { try { return localStorage.getItem(KEY) || "en"; } catch (e) { return "en"; } }
        function apply(lang) {
          document.documentElement.lang = lang;
          document.querySelectorAll("[data-es]").forEach(function (el) {
            if (!el.hasAttribute("data-en")) el.setAttribute("data-en", el.textContent);
            el.textContent = lang === "es" ? el.getAttribute("data-es") : el.getAttribute("data-en");
          });
          document.querySelectorAll("[data-es-html]").forEach(function (el) {
            if (!el.hasAttribute("data-en-html")) el.setAttribute("data-en-html", el.innerHTML);
            el.innerHTML = lang === "es" ? el.getAttribute("data-es-html") : el.getAttribute("data-en-html");
          });
        }
        apply(getLang());

        // Algunos navegadores dentro de apps (Instagram/Facebook) no siguen la
        // navegación por defecto de un <a> con un toque simple (sí con long-press
        // → "Open Link"). Forzamos la navegación por JS al tocar, que sí funciona.
        document.querySelectorAll("a.link-btn").forEach(function (a) {
          a.addEventListener("click", function () {
            var href = a.getAttribute("href");
            if (href) window.location.href = href;
          });
        });
      })();
    </script>
  </body>
</html>
