# TEMPORAL: genera las voces de los ganchos alternativos del video de marketing. Se borra al terminar.
name: tts-tmp
on:
  push:
    branches: [claude/admiring-ride-z5bqpw]
    paths: [.github/workflows/tts-tmp.yml]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Generate voiceover
        run: |
          V=en-US-AvaNeural
          cd tts-tmp
          edge-tts -v $V --rate=+8% -t "Six friends. One bill. Zero idea who had what." --write-media hA.mp3
          edge-tts -v $V --rate=+8% -t "Okay... who had the octopus?" --write-media hB.mp3
          edge-tts -v $V --rate=+8% -t "There's always one friend who forgot their wallet." --write-media hC.mp3
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
          git add tts-tmp/*.mp3
          git commit -m "tts-tmp: hook voiceovers (temporal)"
          git push
