# TEMPORAL: regenera una frase de la voz en off del video de marketing. Se borra al terminar.
name: tts-tmp
on:
  push:
    branches: [claude/admiring-ride-z5bqpw]
    paths: [.github/workflows/tts-tmp.yml]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Generate voiceover
        run: |
          cd tts-tmp
          edge-tts -v en-US-AvaNeural --rate=+8% -t "Snap the receipt. A.I. reads every item, and everyone picks what they had." --write-media 3.mp3
          edge-tts -v en-US-AvaNeural --rate=+8% -t "Snap the receipt. Our AI reads every item, and everyone picks what they had." --write-media 3b.mp3
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898289+github-actions[bot]@users.noreply.github.com"
          git add tts-tmp/*.mp3
          git commit -m "tts-tmp: voiceover line 3 (temporal)"
          git push
